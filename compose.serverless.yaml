services:
  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: apigateway,cloudformation,events,iam,lambda,logs,s3,sqs,stepfunctions,sts
      SQS_ENDPOINT_STRATEGY: dynamic
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 2s
      retries: 40
